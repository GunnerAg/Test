name: Wallet Adapter Pipeline

on:
  pull_request:
    branches:
      - 'collaborate/adapter/**'
  push:
    branches:
      - 'collaborate/adapter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Extract adapter name
        id: extract
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          ADAPTER_NAME=${BRANCH_NAME#collaborate/adapter/}
          echo "adapter_name=$ADAPTER_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
      
      - name: Run adapter validation script
        run: node scripts/validate-adapter.js collaborate/adapter/${{ steps.extract.outputs.adapter_name }}

  sync-to-bitbucket:
    needs: validate
    if: github.event_name == 'push' && contains(github.ref, 'collaborate/adapter/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract adapter name
        id: extract
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          ADAPTER_NAME=${BRANCH_NAME#collaborate/adapter/}
          echo "adapter_name=$ADAPTER_NAME" >> $GITHUB_OUTPUT
      
      - name: Analyze adapter dependencies
        id: dependencies
        run: |
          ADAPTER_NAME=${{ steps.extract.outputs.adapter_name }}
          ADAPTER_FILE=packages/wallet/src/adapters/${ADAPTER_NAME}Wallet.ts
          
          # Extract imports from the adapter file
          IMPORTS=$(grep -o "import.*from.*'.*'" $ADAPTER_FILE || echo "")
          
          # Find external package imports (not relative)
          PACKAGES=$(echo "$IMPORTS" | grep -v "from '\./" || echo "")
          
          # Extract package names
          DEPS=$(echo "$PACKAGES" | grep -o "'[^']*'" | grep -v "@m3s" | tr -d "'" || echo "")
          
          # Output discovered dependencies
          if [ ! -z "$DEPS" ]; then
            echo "dependencies=$(echo $DEPS | tr '\n' ' ')" >> $GITHUB_OUTPUT
            echo "Found dependencies: $DEPS"
          else
            echo "No external dependencies found"
          fi

      - name: Prepare adapter files for Bitbucket
        run: |
          # Create a temporary directory structure
          mkdir -p temp_branch/packages/wallet/src/adapters
          
          # Copy only the adapter implementation file
          cp packages/wallet/src/adapters/${{ steps.extract.outputs.adapter_name }}Wallet.ts temp_branch/packages/wallet/src/adapters/
          
          # Generate registration file automatically
          cat > temp_branch/packages/wallet/src/adapters/${{ steps.extract.outputs.adapter_name }}Wallet.registration.ts << EOF
          import { adapterRegistry } from './registry.js';
          import { WalletType } from '../types/index.js';
          import { ${{ steps.extract.outputs.adapter_name }}WalletAdapter } from './${{ steps.extract.outputs.adapter_name }}Wallet.js';

          adapterRegistry.register({
            name: "${{ steps.extract.outputs.adapter_name }}",
            adapterType: WalletType['${{ steps.extract.outputs.adapter_name }}'], 
            adapterClass: ${{ steps.extract.outputs.adapter_name }}WalletAdapter,
            requirements: [],
          });
          EOF
      
      - name: Update package.json with dependencies
        if: steps.dependencies.outputs.dependencies != ''
        run: |
          # Create package.json with peerDependencies if it doesn't exist
          if [ ! -f "temp_branch/packages/wallet/package.json" ]; then
            mkdir -p temp_branch/packages/wallet
            cp packages/wallet/package.json temp_branch/packages/wallet/
          fi
          
          # Add discovered dependencies to peerDependencies
          for DEP in ${{ steps.dependencies.outputs.dependencies }}; do
            # Check if package is already in peerDependencies
            if ! grep -q "\"$DEP\":" temp_branch/packages/wallet/package.json; then
              # Use jq to add to peerDependencies
              jq --arg dep "$DEP" '.peerDependencies[$dep] = "^1.0.0"' \
                temp_branch/packages/wallet/package.json > temp.json && mv temp.json temp_branch/packages/wallet/package.json
              
              # Also make it optional in peerDependenciesMeta
              jq --arg dep "$DEP" '.peerDependenciesMeta[$dep] = {"optional": true}' \
                temp_branch/packages/wallet/package.json > temp.json && mv temp.json temp_branch/packages/wallet/package.json
              
              echo "Added $DEP to peerDependencies"
            fi
          done

      - name: Update version matrix for adapter
        run: |
          # Run the matrix update script and capture the features
          ADAPTER_NAME=${{ steps.extract.outputs.adapter_name }}
          node scripts/update-version-matrix.js $ADAPTER_NAME
          
          # Copy the updated version matrix to the temp branch
          mkdir -p temp_branch/packages/utils/src/versions
          cp packages/utils/src/versions/versionMatrix.json temp_branch/packages/utils/src/versions/
          cp version-matrix.json temp_branch/
          
          # Add a note about version matrix update in the commit message
          echo "Version matrix updated with $ADAPTER_NAME capabilities" >> temp_branch/update_notes.txt

      - name: Push to Bitbucket
        run: |
          cd temp_branch
          git init
          git config user.email "${{ secrets.BITBUCKET_BOT_EMAIL }}"
          git config user.name "GitHub Actions Bot"
          git add .
          git commit -m "Add ${{ steps.extract.outputs.adapter_name }} adapter from GitHub contribution"
          
          # Clean token and repo path to remove any newlines or special characters
          TOKEN=$(echo "${{ secrets.BITBUCKET_ACCESS_TOKEN }}" | tr -d '\n\r')
          REPO_PATH=$(echo "${{ secrets.BITBUCKET_REPO_PATH }}" | tr -d '\n\r')
          
          # Configure Git credentials with a cleaner approach
          git config --global credential.helper store
          echo "https://x-token-auth:${TOKEN}@bitbucket.org" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          
          # Push using a cleaner URL format
          git push --force https://bitbucket.org/${REPO_PATH}.git HEAD:refs/heads/github/${{ steps.extract.outputs.adapter_name }}
          
          # Clean up credentials
          rm -f ~/.git-credentials